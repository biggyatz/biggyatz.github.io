<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Opening WhatsApp</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; background: #F6F2E9; color: #1B2131; padding: 16px; text-align: center; }
  @media (prefers-color-scheme: dark) { body { background: #10151F; color: #ECE8DE; } a { color: #D3A45C; } }
  a { color: #7A5626; font-weight: 600; }
</style>
</head>
<body>
<main><p>Opening WhatsApp…</p><p><a id="go" href="https://wa.me/9779818074225">Tap here if it doesn't open</a></p></main>
<script>
  // Counts the click (Cloudflare records this page view), then opens WhatsApp with a message for the service picked.
  (function () {
    const msgs = {
      automation: "Hi Biggyat, I saw your site and I'd like to discuss automating some finance work (reports / reconciliations / document extraction).",
      dashboards: "Hi Biggyat, I saw your site and I'd like to discuss a dashboard or data app for my team.",
      training: "Hi Biggyat, I saw your site and I'd like to discuss an AI training workshop for my team.",
      general: "Hi Biggyat, I saw your projects and I'd like to discuss a project."
    };
    const s = new URLSearchParams(location.search).get("s");
    const url = "https://wa.me/9779818074225?text=" + encodeURIComponent(msgs[s] || msgs.general);
    document.getElementById("go").href = url;
    setTimeout(() => location.replace(url), 700);
  })();
</script>
